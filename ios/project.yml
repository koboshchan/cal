name: Cal
options:
  bundleIdPrefix: com.cal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.5.0

targets:
  Cal:
    type: application
    platform: iOS
    sources:
      - path: Cal
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    info:
      path: Cal/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Cal
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: "Cal uses your photo library to let you attach a picture of a schedule."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kobosh.cal
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: true
